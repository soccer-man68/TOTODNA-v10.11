<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>TOTO_DNA v10.11 - Advanced Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        :root { --bg: #2c3e50; --green: #27ae60; --purple: #8e44ad; --yellow: #f1c40f; --red: #e74c3c; --dark: #1e272e; }
        body { font-family: 'Malgun Gothic', 'Consolas'; margin: 0; background: #f4f7f6; font-size: 12px; }
        #password-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; }
        #password-overlay input { padding: 12px; font-size: 1.1rem; text-align: center; border-radius: 5px; border: none; margin-bottom: 10px; width: 250px; }
        header { background: var(--bg); color: white; padding: 12px 20px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; font-size: 12px; }
        .tabs { display: flex; background: #dfe6e9; padding: 5px 10px 0; border-bottom: 2px solid #bdc3c7; }
        .tab { padding: 10px 20px; cursor: pointer; background: #b2bec3; margin-right: 4px; border-radius: 6px 6px 0 0; font-weight: bold; }
        .tab.active { background: white; border: 1px solid #bdc3c7; border-bottom: 2px solid white; color: var(--bg); }
        .content-area { display: none; padding: 15px; height: calc(100vh - 160px); overflow: auto; background: white; }
        .content-area.active { display: block; }
        table { width: 100%; border-collapse: collapse; min-width: 1150px; }
        th { background: #34495e; color: white; padding: 10px; position: sticky; top: -16px; z-index: 10; }
        td { border: 1px solid #dfe6e9; padding: 6px; text-align: center; }
        .win { color: #0984e3; font-weight: bold; }
        .draw { color: #00b894; font-weight: bold; }
        .loss { color: #d63031; font-weight: bold; }
        .is-pattern { background-color: #D6EAF8; font-weight: bold; border: 1.5px solid #3498db !important; }
        .strong-pick { background: #eb4d4b !important; color: white !important; padding: 2px 5px; border-radius: 3px; font-weight: bold; }
        .tier-card { border-left: 5px solid #00d2d3; background: #2d3436; padding: 18px; margin-bottom: 15px; color: #ecf0f1; border-radius: 0 8px 8px 0; }
        .tier-title { color: #f1c40f; font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; }
        .combo-box { border-top: 1px dashed #555; padding-top: 10px; margin-top: 10px; }
        .odds-val { color: #ff5e57; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="password-overlay">
        <h2 style="color: white;">TOTO_DNA v10.11 ENGINE</h2>
        <input type="password" id="pw-input" placeholder="비밀번호 입력">
        <button class="btn" style="background:var(--green); width:250px;" onclick="checkPw()">시스템 로그인</button>
    </div>

    <header>
        <span style="font-size: 1.3rem; font-weight: bold; color: var(--yellow);">TOTO_DNA DNA</span>
        <button class="btn" style="background:var(--green);" onclick="document.getElementById('file-input').click()">📊 데이터 분석 실행</button>
        <button class="btn" style="background:var(--purple);" onclick="runSimulation()">🧪 성능 시뮬레이션</button>
        <input type="file" id="file-input" style="display:none" accept=".xlsx">
        <span id="status" style="color:var(--yellow); margin-left:15px;">SYSTEM READY</span>
    </header>

    <div class="tabs">
        <div class="tab active" onclick="switchTab(0)">[전체 경기]</div>
        <div class="tab" onclick="switchTab(1)">[승무패 경기]</div>
        <div class="tab" onclick="switchTab(2)">[🔥 3.4.5 티어 추천]</div>
    </div>

    <div id="tab0" class="content-area active">
        <table>
            <thead>
                <tr>
                    <th>시간</th><th>리그</th><th>경기 정보 (HOME vs AWAY)</th><th>일반배당 패턴</th><th>H</th><th>핸디배당 패턴</th><th>AI 예측 엔진 결론</th>
                </tr>
            </thead>
            <tbody id="list-all"></tbody>
        </table>
    </div>
    <div id="tab1" class="content-area"><table id="list-smp"></table></div>
    <div id="tab2" class="content-area" style="background:var(--dark);"><div id="tier-results"></div></div>

    <script>
        let normalBgColor = null;
        let pastData = [], upcomingData = [];
        let caches = { lvl1: {}, lvl2: {}, lvl3: {} };
        let teamHistory = {};

        function checkPw() {
            if(document.getElementById('pw-input').value === "4938") document.getElementById('password-overlay').style.display='none';
        }

        function switchTab(idx) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i===idx));
            document.querySelectorAll('.content-area').forEach((c, i) => c.classList.toggle('active', i===idx));
        }

        function getColorKey(cell) {
            if (!cell || !cell.fill || !cell.fill.fgColor) return "NO_FILL";
            const fg = cell.fill.fgColor;
            if (fg.argb) return "R" + fg.argb;
            if (fg.theme !== undefined) return "T" + fg.theme + "_" + (fg.tint || 0);
            return "NO_FILL";
        }

        // --- 파이썬의 itertools.combinations 구현 ---
        function getCombinations(array, size) {
            const result = [];
            function backtrack(start, combo) {
                if (combo.length === size) {
                    result.push([...combo]);
                    return;
                }
                for (let i = start; i < array.length; i++) {
                    combo.push(array[i]);
                    backtrack(i + 1, combo);
                    combo.pop();
                }
            }
            backtrack(0, []);
            return result;
        }

        document.getElementById('file-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            document.getElementById('status').innerText = "⚙️ 엔진 동기화 중...";
            const workbook = new ExcelJS.Workbook();
            await workbook.xlsx.load(file);
            const ws = workbook.getWorksheet('일반핸디') || workbook.worksheets[0];

            const colorCounts = {};
            for(let i=2; i<=100; i++) {
                const c = getColorKey(ws.getRow(i).getCell(8));
                if(c !== "NO_FILL") colorCounts[c] = (colorCounts[c] || 0) + 1;
            }
            normalBgColor = Object.keys(colorCounts).reduce((a, b) => colorCounts[a] > colorCounts[b] ? a : b, "NO_FILL");

            pastData = []; upcomingData = []; teamHistory = {};
            caches = { lvl1: {}, lvl2: {}, lvl3: {} };
            
            ws.eachRow((row, rowNumber) => {
                if(rowNumber < 2) return;
                const league = row.getCell(3).value;
                if(!league) return;

                const getPat = (cols) => {
                    let p = [];
                    cols.forEach((cIdx, i) => {
                        const cell = row.getCell(cIdx);
                        if(getColorKey(cell) !== normalBgColor && getColorKey(cell) !== "NO_FILL") p.push(["승","무","패"][i]);
                    });
                    return p;
                };

                const m = {
                    time: String(row.getCell(2).value || "").substring(5,16),
                    league: String(league),
                    home: String(row.getCell(4).value || ""),
                    away: String(row.getCell(6).value || ""),
                    gOdds: [row.getCell(8).value, row.getCell(9).value, row.getCell(10).value],
                    handi: row.getCell(15).value,
                    hOdds: [row.getCell(16).value, row.getCell(17).value, row.getCell(18).value],
                    gPat: getPat([8, 9, 10]).join(""),
                    hPat: getPat([16, 17, 18]).join(""),
                    genRes: String(row.getCell(11).value || "").trim(),
                    hanRes: String(row.getCell(19).value || "").trim(),
                    isSmp: (getColorKey(row.getCell(3)) !== "NO_FILL" && getColorKey(row.getCell(3)) !== normalBgColor)
                };

                if(m.genRes === "" || m.genRes === "None") upcomingData.push(m);
                else {
                    pastData.push(m);
                    const resKey = `${m.genRes}_${m.hanRes}`;
                    const k1 = `${m.league}_${m.handi}_${m.gPat}`, k2 = `${m.league}_${m.gPat}`, k3 = `${m.gPat}_${m.hPat}`;
                    [ [caches.lvl1, k1], [caches.lvl2, k2], [caches.lvl3, k3] ].forEach(([cache, k]) => {
                        if(!cache[k]) cache[k] = {};
                        cache[k][resKey] = (cache[k][resKey] || 0) + 1;
                    });
                    if(!teamHistory[m.home]) teamHistory[m.home] = [];
                    if(!teamHistory[m.away]) teamHistory[m.away] = [];
                    teamHistory[m.home].push(m.genRes);
                    const rev = { "승":"패", "패":"승", "무":"무" };
                    teamHistory[m.away].push(rev[m.genRes] || "무");
                }
            });

            renderAll();
            generateTierCombos(); // 티어 생성 호출
            document.getElementById('status').innerText = `✅ 완료: 과거(${pastData.length}) / 예정(${upcomingData.length})`;
        });

        function getMomentumScore(team) {
            const recent = (teamHistory[team] || []).slice(-6);
            let score = 0;
            recent.forEach((res, i) => {
                const weight = (i + 1) * 0.3;
                if(res === "승") score += 3 * weight;
                else if(res === "무") score += 1 * weight;
            });
            return { score: Number(score.toFixed(1)), history: recent };
        }

        function getPredictionAI(m) {
            let points = {};
            let totalHits = 0;
            const analysisLevels = [
                [caches.lvl1, 20.0, `${m.league}_${m.handi}_${m.gPat}`],
                [caches.lvl2, 10.0, `${m.league}_${m.gPat}`],
                [caches.lvl3, 5.0, `${m.gPat}_${m.hPat}`]
            ];

            analysisLevels.forEach(([cache, weight, key]) => {
                const counter = cache[key];
                if(counter) {
                    for(let resKey in counter) {
                        const [gRes, hRes] = resKey.split("_");
                        const count = counter[resKey];
                        totalHits += count;
                        for(let p of m.gPat) if(gRes === p) points[`일반[${p}]`] = (points[`일반[${p}]`] || 0) + weight * count;
                        for(let p of m.hPat) if(hRes === p) points[`핸디[${p}]`] = (points[`핸디[${p}]`] || 0) + weight * count;
                    }
                }
            });

            if(Object.keys(points).length === 0) return { text: "패턴 부족", conf: 0 };

            const hMom = getMomentumScore(m.home).score, aMom = getMomentumScore(m.away).score;
            if(hMom - aMom >= 5.0 && points["일반[승]"]) points["일반[승]"] *= 1.3;
            else if(hMom - aMom <= -5.0 && points["일반[패]"]) points["일반[패]"] *= 1.3;

            const sorted = Object.entries(points).sort((a,b) => b[1] - a[1]);
            const [bestKey, bestVal] = sorted[0];
            const sumPoints = Object.values(points).reduce((a,b) => a+b, 0);
            let confidence = Math.min(100, Math.floor((bestVal / sumPoints) * 70 + Math.min(totalHits, 25) * 1.2));
            return { text: `[${confidence >= 82 ? '🔥강력' : (confidence >= 68 ? '추천' : '일반')}] ${bestKey} (${confidence}점)`, key: bestKey, conf: confidence };
        }

        function generateTierCombos() {
            const container = document.getElementById('tier-results');
            container.innerHTML = `<h2 style="color:var(--yellow); text-align:center;">🚀 Ninety-Nine Multi-Tier Engine</h2>`;
            
            // 1. 후보 경기 선정 (파이썬과 동일: conf >= 62, odds > 1.05)
            const candidates = upcomingData.map(m => {
                const p = getPredictionAI(m);
                let oddsVal = 0;
                if(p.conf >= 62) {
                    const pick = p.key.split('[')[1][0];
                    const idx = pick === "승" ? 0 : (pick === "무" ? 1 : 2);
                    oddsVal = p.key.includes("일반") ? Number(m.gOdds[idx]) : Number(m.hOdds[idx]);
                }
                return { m, p, odds: oddsVal || 0 };
            }).filter(c => c.odds > 1.05).sort((a,b) => b.p.conf - a.p.conf).slice(0, 24);

            const findCombos = (count, minO, maxO, label) => {
                let html = `<div class="tier-card"><div class="tier-title">💎 ${label}</div>`;
                // 파이썬 itertools.combinations 로직 전수 조사
                const allCombos = getCombinations(candidates, count);
                const found = [];

                allCombos.forEach(combo => {
                    const totalO = combo.reduce((a, b) => a * b.odds, 1);
                    const avgConf = combo.reduce((a, b) => a + b.p.conf, 0) / count;
                    if(totalO >= minO && totalO <= maxO) found.push({combo, totalO, avgConf});
                });

                found.sort((a, b) => b.avgConf - a.avgConf); // 신뢰도순 정렬

                if(found.length === 0) {
                    html += `<div style="color:#777">해당 구간(${minO}~${maxO}배)에 맞는 최적 조합이 없습니다.</div>`;
                } else {
                    found.slice(0, 2).forEach(f => {
                        html += `<div class="combo-box">★ <span class="odds-val">${f.totalO.toFixed(2)}배</span> (평균 신뢰도: ${f.avgConf.toFixed(1)}점)<br>`;
                        f.combo.forEach(c => html += ` > ${c.m.home} vs ${c.m.away} | ${c.p.key} (${c.odds.toFixed(2)}배)<br>`);
                        html += `</div>`;
                    });
                }
                container.insertAdjacentHTML('beforeend', html + `</div>`);
            };

            // 파이썬 코드의 티어 배당 구간 설정
            findCombos(3, 5.0, 15.0, "TIER 1 (500%~1500% 타겟)");
            findCombos(4, 16.0, 30.0, "TIER 2 (중배당 핵심 전략)");
            findCombos(5, 31.0, 99.0, "TIER 3 (나인티나인 잭팟)");
        }

        function renderAll() {
            const listAll = document.getElementById('list-all');
            const listSmp = document.getElementById('list-smp');
            listAll.innerHTML = ""; listSmp.innerHTML = "";

            upcomingData.forEach((m) => {
                const pred = getPredictionAI(m);
                const colorClass = pred.key?.includes("승") ? "win" : (pred.key?.includes("패")?"loss":"draw");
                const html = `
                    <tr>
                        <td>${m.time}</td>
                        <td><span class="${m.isSmp?'smp-league':''}">${m.league}</span></td>
                        <td style="text-align:left"><b>${m.home}</b> vs ${m.away}</td>
                        <td>${renderOdds(m.gOdds, m.gPat)}</td>
                        <td style="background:#f1f2f6">${m.handi}</td>
                        <td>${renderOdds(m.hOdds, m.hPat)}</td>
                        <td class="${pred.conf>=82?'strong-pick':colorClass}">${pred.text}</td>
                    </tr>
                `;
                listAll.insertAdjacentHTML('beforeend', html);
                if(m.isSmp) listSmp.insertAdjacentHTML('beforeend', html);
            });
        }

        function renderOdds(odds, patStr) {
            return odds.map((o, i) => {
                const label = ["승","무","패"][i];
                const active = patStr.includes(label) ? "is-pattern" : "";
                return `<span class="${active}" style="padding:2px 4px; margin:0 2px;">${o?Number(o).toFixed(2):'0.00'}</span>`;
            }).join("");
        }

        function runSimulation() {
            const samples = pastData.slice(-100);
            let hits = 0;
            samples.forEach(m => {
                const p = getPredictionAI(m);
                if(p.key && (m.genRes === p.key.split('[')[1][0] || m.hanRes === p.key.split('[')[1][0])) hits++;
            });
            alert(`🧪 최근 100경기 백테스팅 결과: 적중률 ${(hits/samples.length*100).toFixed(1)}%`);
        }
    </script>
</body>
</html>
