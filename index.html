<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>TOTO_DNA v10.11 - Full Expert System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        :root { --bg: #2c3e50; --green: #27ae60; --purple: #8e44ad; --yellow: #f1c40f; --red: #e74c3c; --dark: #1e272e; }
        body { font-family: 'Malgun Gothic', 'Consolas'; margin: 0; background: #f4f7f6; font-size: 12px; }
        
        /* 암호 레이어 */
        #password-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; }
        #password-overlay input { padding: 12px; font-size: 1.1rem; text-align: center; border-radius: 5px; border: none; margin-bottom: 10px; }
        
        /* 헤더 & 컨트롤 */
        header { background: var(--bg); color: white; padding: 12px 20px; display: flex; align-items: center; gap: 10px; sticky: top; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; font-size: 12px; }
        #status { font-weight: bold; color: var(--yellow); margin-left: 10px; }

        /* 탭 디자인 */
        .tabs { display: flex; background: #dfe6e9; padding: 5px 10px 0; border-bottom: 2px solid #bdc3c7; }
        .tab { padding: 10px 20px; cursor: pointer; background: #b2bec3; margin-right: 4px; border-radius: 6px 6px 0 0; font-weight: bold; }
        .tab.active { background: white; border: 1px solid #bdc3c7; border-bottom: 2px solid white; color: var(--bg); }
        
        .content-area { display: none; padding: 15px; height: calc(100vh - 150px); overflow: auto; background: white; }
        .content-area.active { display: block; }

        /* 테이블 공통 */
        table { width: 100%; border-collapse: collapse; min-width: 1100px; }
        th { background: #34495e; color: white; padding: 10px; position: sticky; top: -16px; z-index: 10; }
        td { border: 1px solid #dfe6e9; padding: 6px; text-align: center; }
        tr:hover { background: #f1f2f6; }

        /* 결과 색상 */
        .win { color: #0984e3; font-weight: bold; }
        .draw { color: #00b894; font-weight: bold; }
        .loss { color: #d63031; font-weight: bold; }
        .is-pattern { background-color: #D6EAF8; font-weight: bold; border: 1.5px solid #3498db !important; }
        .strong-pick { background: #eb4d4b; color: white; padding: 2px 5px; border-radius: 3px; font-weight: bold; }
        .smp-league { background: #6c5ce7; color: white; padding: 2px 5px; border-radius: 3px; font-size: 10px; }

        /* 티어 추천 전용 디자인 */
        .tier-view { background: var(--dark); color: #ecf0f1; padding: 20px; border-radius: 8px; }
        .tier-card { border-left: 4px solid #00d2d3; background: #2d3436; padding: 15px; margin-bottom: 15px; }
        .tier-title { color: #f1c40f; font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; }
        .combo-line { padding: 5px 0; border-bottom: 1px dashed #4b4b4b; }
        .odds-text { color: #ff5e57; font-weight: bold; }

        /* 모달 리포트 */
        #modal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:550px; background:white; z-index:2000; padding:20px; border-radius:10px; box-shadow:0 0 30px rgba(0,0,0,0.5); }
        .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:1999; }
    </style>
</head>
<body>

    <!-- 암호 인증 -->
    <div id="password-overlay">
        <h2 style="color: white; margin-bottom: 20px;">TOTO_DNA v10.11 SYSTEM</h2>
        <input type="password" id="pw-input" placeholder="비밀번호 4938 입력">
        <button class="btn" style="background:var(--green); width:250px;" onclick="checkPw()">시스템 로그인</button>
    </div>

    <!-- 헤더 메뉴 -->
    <header>
        <span style="font-size: 1.3rem; font-weight: bold; color: var(--yellow);">TOTO_DNA v10.11</span>
        <button class="btn" style="background:var(--green);" onclick="document.getElementById('file-input').click()">📊 데이터 분석 실행</button>
        <button class="btn" style="background:var(--purple);" onclick="runSimulation()">🧪 시뮬레이션 검증</button>
        <input type="file" id="file-input" style="display:none" accept=".xlsx">
        <span id="status">READY</span>
    </header>

    <!-- 탭 메뉴 -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab(0)">[전체 경기]</div>
        <div class="tab" onclick="switchTab(1)">[승무패 경기]</div>
        <div class="tab" onclick="switchTab(2)">[정밀 시나리오]</div>
        <div class="tab" onclick="switchTab(3)">[🔥 3.4.5 티어 추천]</div>
    </div>

    <!-- 내용 영역 -->
    <div id="tab0" class="content-area active">
        <table>
            <thead>
                <tr>
                    <th>시간</th><th>리그</th><th>경기 정보 (HOME vs AWAY)</th><th>일반배당 패턴</th><th>H</th><th>핸디배당 패턴</th><th>AI 예측 엔진 결론</th>
                </tr>
            </thead>
            <tbody id="list-all"></tbody>
        </table>
    </div>

    <div id="tab1" class="content-area">
        <table id="list-smp"></table> <!-- 전체 경기와 동일 구조 -->
    </div>

    <div id="tab2" class="content-area">
        <table>
            <thead>
                <tr>
                    <th>리그</th><th>패턴 조합</th><th>AI 주력</th><th>과거 데이터 (적중/전체)</th><th>적중률</th>
                </tr>
            </thead>
            <tbody id="list-scenario"></tbody>
        </table>
    </div>

    <div id="tab3" class="content-area tier-view">
        <div id="tier-results">
            <h3 style="text-align:center; color:#95a5a6;">데이터 분석을 실행하면 프리미엄 조합이 생성됩니다.</h3>
        </div>
    </div>

    <!-- 상세 리포트 모달 -->
    <div class="overlay" onclick="closeModal()"></div>
    <div id="modal">
        <h3 id="m-title" style="margin-top:0;">🔍 정밀 분석 리포트</h3>
        <div id="m-content" style="white-space: pre-wrap; line-height: 1.6; font-size: 13px;"></div>
        <button class="btn" style="background:var(--bg); width:100%; margin-top:15px;" onclick="closeModal()">닫기</button>
    </div>

    <script>
        let normalBgColor = null;
        let pastData = [], upcomingData = [];
        let caches = { lvl1: {}, lvl2: {}, lvl3: {} };
        let scenarioStats = {};

        function checkPw() {
            if(document.getElementById('pw-input').value === "4938") document.getElementById('password-overlay').style.display='none';
        }

        function switchTab(idx) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i===idx));
            document.querySelectorAll('.content-area').forEach((c, i) => c.classList.toggle('active', i===idx));
        }

        function getColorKey(cell) {
            if (!cell || !cell.fill || !cell.fill.fgColor) return "NO_FILL";
            const fg = cell.fill.fgColor;
            if (fg.argb) return "R" + fg.argb;
            if (fg.theme !== undefined) return "T" + fg.theme + "_" + (fg.tint || 0);
            return "NO_FILL";
        }

        document.getElementById('file-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            document.getElementById('status').innerText = "⚙️ 분석 및 패턴 매칭 중...";
            
            const workbook = new ExcelJS.Workbook();
            await workbook.xlsx.load(file);
            const ws = workbook.getWorksheet('일반핸디') || workbook.worksheets[0];

            // 1. 배경색 학습 (파이썬 learn_colors_smart)
            const colorCounts = {};
            for(let i=2; i<=100; i++) {
                const c = getColorKey(ws.getRow(i).getCell(8));
                if(c !== "NO_FILL") colorCounts[c] = (colorCounts[c] || 0) + 1;
            }
            normalBgColor = Object.keys(colorCounts).reduce((a, b) => colorCounts[a] > colorCounts[b] ? a : b, "NO_FILL");

            // 2. 데이터 분류
            pastData = []; upcomingData = []; caches = { lvl1: {}, lvl2: {}, lvl3: {} };
            
            ws.eachRow((row, rowNumber) => {
                if(rowNumber < 2) return;
                const league = row.getCell(3).value;
                if(!league) return;

                const getPat = (cols) => {
                    let p = [];
                    cols.forEach((cIdx, i) => {
                        const cell = row.getCell(cIdx);
                        const cKey = getColorKey(cell);
                        if(cKey !== normalBgColor && cKey !== "NO_FILL") p.push(["승","무","패"][i]);
                    });
                    return p;
                };

                const gPatArr = getPat([8, 9, 10]);
                const hPatArr = getPat([16, 17, 18]);
                const leagueColor = getColorKey(row.getCell(3));

                const m = {
                    time: String(row.getCell(2).value || "").substring(5,16),
                    league: String(league),
                    home: String(row.getCell(4).value || ""),
                    away: String(row.getCell(6).value || ""),
                    gOdds: [row.getCell(8).value, row.getCell(9).value, row.getCell(10).value],
                    handi: row.getCell(15).value,
                    hOdds: [row.getCell(16).value, row.getCell(17).value, row.getCell(18).value],
                    gPat: gPatArr.join(""),
                    hPat: hPatArr.join(""),
                    genRes: String(row.getCell(11).value || "").trim(),
                    hanRes: String(row.getCell(19).value || "").trim(),
                    isSmp: (leagueColor !== "NO_FILL" && leagueColor !== normalBgColor)
                };

                if(m.genRes === "" || m.genRes === "None") upcomingData.push(m);
                else {
                    pastData.push(m);
                    // 캐시 빌드 (Python build_stat_engine)
                    const resKey = `${m.genRes}_${m.hanRes}`;
                    const k1 = `${m.league}_${m.handi}_${m.gPat}`;
                    if(!caches.lvl1[k1]) caches.lvl1[k1] = {};
                    caches.lvl1[k1][resKey] = (caches.lvl1[k1][resKey] || 0) + 1;
                }
            });

            renderAll();
            generateTierCombos();
            document.getElementById('status').innerText = `✅ 완료: 과거(${pastData.length}) / 예정(${upcomingData.length})`;
        });

        function getPredictionAI(m) {
            const k1 = `${m.league}_${m.handi}_${m.gPat}`;
            const stats = caches.lvl1[k1];
            let pick = "승", score = 60, hits = 0, total = 0;

            if(stats) {
                let maxC = -1;
                for(let res in stats) {
                    total += stats[res];
                    if(stats[res] > maxC) {
                        maxC = stats[res];
                        pick = res.split("_")[0];
                        hits = maxC;
                    }
                }
                score = Math.floor((hits / total) * 70 + Math.min(total, 25));
            } else {
                pick = m.gPat.includes("패") ? "패" : (m.gPat.includes("무") ? "무" : "승");
                score = 55;
            }

            if(score > 99) score = 99;
            const prefix = score >= 82 ? "🔥[강력]" : (score >= 68 ? "[추천]" : "[일반]");
            return { text: `${prefix} 일반[${pick}] (${score}점)`, pick, score, hits, total };
        }

        function renderAll() {
            const listAll = document.getElementById('list-all');
            const listSmp = document.getElementById('list-smp');
            const listScen = document.getElementById('list-scenario');
            listAll.innerHTML = ""; listSmp.innerHTML = ""; listScen.innerHTML = "";
            scenarioStats = {};

            upcomingData.forEach((m, idx) => {
                const pred = getPredictionAI(m);
                const colorClass = pred.pick === "승"?"win": (pred.pick === "패"?"loss":"draw");
                const html = `
                    <tr ondblclick="showDetail(${idx})">
                        <td>${m.time}</td>
                        <td><span class="${m.isSmp?'smp-league':''}">${m.league}</span></td>
                        <td style="text-align:left"><b>${m.home}</b> vs ${m.away}</td>
                        <td>${renderOdds(m.gOdds, m.gPat)}</td>
                        <td style="background:#f1f2f6">${m.handi}</td>
                        <td>${renderOdds(m.hOdds, m.hPat)}</td>
                        <td class="${pred.score>=82?'strong-pick':colorClass}">${pred.text}</td>
                    </tr>
                `;
                listAll.insertAdjacentHTML('beforeend', html);
                if(m.isSmp) listSmp.insertAdjacentHTML('beforeend', html);

                // 시나리오 통계용 데이터 수집
                const sKey = `${m.league}_${m.gPat}`;
                if(!scenarioStats[sKey]) scenarioStats[sKey] = { hits:0, total:0, best: pred.pick };
            });

            // 시나리오 탭 채우기 (과거 적중률 계산)
            pastData.forEach(p => {
                const sKey = `${p.league}_${p.gPat}`;
                if(scenarioStats[sKey]) {
                    scenarioStats[sKey].total++;
                    if(p.genRes === scenarioStats[sKey].best) scenarioStats[sKey].hits++;
                }
            });

            for(let key in scenarioStats) {
                const d = scenarioStats[key];
                if(d.total === 0) continue;
                const rate = (d.hits/d.total*100).toFixed(1);
                listScen.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td>${key.split('_')[0]}</td>
                        <td>${key.split('_')[1]}</td>
                        <td>일반[${d.best}]</td>
                        <td>${d.hits} / ${d.total}</td>
                        <td style="color:${rate>=75?'red':'black'}; font-weight:bold;">${rate}%</td>
                    </tr>
                `);
            }
        }

        function renderOdds(odds, patStr) {
            return odds.map((o, i) => {
                const label = ["승","무","패"][i];
                const active = patStr.includes(label) ? "is-pattern" : "";
                return `<span class="${active}" style="padding:2px 4px; margin:0 2px;">${o?Number(o).toFixed(2):'0.00'}</span>`;
            }).join("");
        }

        function generateTierCombos() {
            const container = document.getElementById('tier-results');
            container.innerHTML = `<h2 style="color:var(--yellow); text-align:center;">🚀 Multi-Tier Premium 조합 엔진</h2>`;
            
            const candidates = upcomingData.map(m => ({ m, p: getPredictionAI(m) }))
                .filter(c => c.p.score >= 65)
                .map(c => {
                    const idx = c.p.pick === "승" ? 0 : (c.p.pick === "무" ? 1 : 2);
                    return { ...c, odds: Number(c.m.gOdds[idx]) || 1.0 };
                })
                .sort((a,b) => b.p.score - a.p.score);

            const build = (count, minO, maxO, title) => {
                let found = [];
                for(let i=0; i<Math.min(candidates.length, 10); i++) {
                    let combo = [candidates[i]], totalO = candidates[i].odds;
                    for(let j=i+1; j<candidates.length; j++) {
                        if(combo.length < count) { combo.push(candidates[j]); totalO *= candidates[j].odds; }
                    }
                    if(totalO >= minO && totalO <= maxO) found.push({combo, totalO});
                    if(found.length >= 1) break;
                }
                let html = `<div class="tier-card"><div class="tier-title">${title}</div>`;
                if(!found.length) html += `조건에 맞는 최적의 조합을 생성할 수 없습니다.`;
                found.forEach(f => {
                    html += `<div class="combo-line">★ <span class="odds-text">${f.totalO.toFixed(2)}배</span> 조합<br>`;
                    f.combo.forEach(c => html += ` > ${c.m.home} vs ${c.m.away} | [${c.p.pick}] (${c.odds})<br>`);
                    html += `</div>`;
                });
                container.insertAdjacentHTML('beforeend', html + `</div>`);
            };

            build(3, 6, 15, "TIER 1 (안정적인 수익 목표)");
            build(4, 15, 40, "TIER 2 (고수익 전략 조합)");
            build(5, 50, 150, "TIER 3 (나인티나인 잭팟 엔진)");
        }

        function runSimulation() {
            if(!pastData.length) return alert("분석된 데이터가 없습니다.");
            let hits = 0;
            const samples = pastData.slice(-100);
            samples.forEach(m => {
                const p = getPredictionAI(m);
                if(m.genRes === p.pick) hits++;
            });
            alert(`🧪 최근 100경기 시뮬레이션 결과\n---------------------------\n적중률: ${(hits/samples.length*100).toFixed(1)}%\n환수율 기대치: ${((hits/samples.length)*1.95*100).toFixed(1)}%`);
        }

        function showDetail(idx) {
            const m = upcomingData[idx];
            const p = getPredictionAI(m);
            const content = `
[분석 대상] ${m.league} | ${m.home} vs ${m.away}
[패턴 정보] 일반: ${m.gPat || '없음'} / 핸디: ${m.hPat || '없음'}
------------------------------------------------
▶ AI 예측 결론: ${p.text}
▶ 패턴 매칭 데이터: ${p.hits}회 적중 / 총 ${p.total}회 사례 발견
▶ 신뢰도 점수: ${p.score}점
------------------------------------------------
※ 이 데이터는 과거 동일한 배당 패턴이 발생했을 때의 
실제 결과값을 기반으로 산출되었습니다.
            `;
            document.getElementById('m-content').innerText = content;
            document.getElementById('modal').style.display = 'block';
            document.querySelector('.overlay').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.querySelector('.overlay').style.display = 'none';
        }
    </script>
</body>
</html>
