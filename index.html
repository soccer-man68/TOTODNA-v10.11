<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>TOTO_DNA v10.11 - Visual Expert (Final)</title>
    <!-- 배경색(Style)을 읽기 위해 ExcelJS 사용 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        :root { --bg: #2c3e50; --green: #27ae60; --yellow: #f1c40f; --red: #e74c3c; }
        body { font-family: 'Consolas', '맑은 고딕'; margin: 0; background: #f4f7f6; font-size: 12px; }
        header { background: var(--bg); color: white; padding: 15px; display: flex; align-items: center; gap: 15px; }
        #password-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; }
        #password-overlay input { padding: 12px; font-size: 1.1rem; text-align: center; border-radius: 5px; border: none; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #34495e; color: white; padding: 10px; position: sticky; top: 0; }
        td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        .win { color: #0984e3; font-weight: bold; }
        .draw { color: #00b894; font-weight: bold; }
        .loss { color: #d63031; font-weight: bold; }
        .is-pattern { background-color: #D6EAF8; font-weight: bold; border: 2px solid #3498db !important; }
        .strong { background: #eb4d4b; color: white; padding: 2px 4px; border-radius: 3px; font-weight: bold; }
        #status { font-weight: bold; color: var(--yellow); }
    </style>
</head>
<body>

    <div id="password-overlay">
        <h2 style="color: white;">TOTO_DNA v10.11</h2>
        <input type="password" id="pw-input" placeholder="비밀번호 4938 입력">
        <button class="btn" style="background:var(--green); margin-top:10px;" onclick="checkPw()">인증 및 시스템 시작</button>
    </div>

    <header>
        <span style="font-size: 1.4rem; font-weight: bold; color: var(--yellow);">TOTO_DNA v10.11</span>
        <button class="btn" style="background:var(--green);" onclick="document.getElementById('excel-file').click()">📊 엑셀 데이터 분석 실행</button>
        <input type="file" id="excel-file" style="display:none" accept=".xlsx">
        <span id="status">파일을 대기 중입니다...</span>
    </header>

    <div style="padding:15px;">
        <table>
            <thead>
                <tr>
                    <th>시간</th><th>리그</th><th>HOME vs AWAY</th><th>일반배당 (패턴감지)</th><th>H</th><th>핸디배당 (패턴감지)</th><th>AI 예측 결과</th>
                </tr>
            </thead>
            <tbody id="match-list"></tbody>
        </table>
    </div>

    <script>
        let normalBgColor = null;
        let caches = { lvl1: {}, lvl2: {} };

        function checkPw() {
            if(document.getElementById('pw-input').value === "4938") {
                document.getElementById('password-overlay').style.display = 'none';
            }
        }

        // 파이썬의 get_color_key 함수와 100% 동일한 로직
        function getColorKey(cell) {
            if (!cell.fill || !cell.fill.fgColor) return "NO_FILL";
            const fg = cell.fill.fgColor;
            if (fg.argb) return "R" + fg.argb; // RGB 값 추출
            if (fg.theme !== undefined) return "T" + fg.theme + "_" + fg.tint; // Theme 값 추출
            return "NO_FILL";
        }

        document.getElementById('excel-file').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            document.getElementById('status').innerText = "⚙️ 파이썬 엔진과 동기화 중...";

            const workbook = new ExcelJS.Workbook();
            await workbook.xlsx.load(file);
            const worksheet = workbook.getWorksheet('일반핸디') || workbook.worksheets[0];

            // 1. 기본 배경색 학습 (파이썬 learn_colors_smart 로직)
            const colorCounts = {};
            for(let i=2; i<=50; i++) {
                const cell = worksheet.getRow(i).getCell(8); // 7번 인덱스(H열)
                const c = getColorKey(cell);
                colorCounts[c] = (colorCounts[c] || 0) + 1;
            }
            normalBgColor = Object.keys(colorCounts).reduce((a, b) => colorCounts[a] > colorCounts[b] ? a : b);

            const pastData = [];
            const upcomingData = [];
            caches = { lvl1: {}, lvl2: {} };

            // 2. 데이터 추출 (컬럼 인덱스 파이썬과 100% 일치시킴)
            worksheet.eachRow((row, rowNumber) => {
                if (rowNumber < 2) return;
                
                const league = row.getCell(3).value; // C열 (파이썬 row[2])
                if (!league) return;

                // 일반배당 패턴 (H, I, J열 / 파이썬 7, 8, 9)
                const gPat = [];
                [8, 9, 10].forEach((col, idx) => {
                    const cell = row.getCell(col);
                    if (getColorKey(cell) !== normalBgColor && getColorKey(cell) !== "NO_FILL") {
                        gPat.push(["승","무","패"][idx]);
                    }
                });

                // 핸디배당 패턴 (P, Q, R열 / 파이썬 15, 16, 17)
                const hPat = [];
                [16, 17, 18].forEach((col, idx) => {
                    const cell = row.getCell(col);
                    if (getColorKey(cell) !== normalBgColor && getColorKey(cell) !== "NO_FILL") {
                        hPat.push(["승","무","패"][idx]);
                    }
                });

                const m = {
                    time: String(row.getCell(2).value || "").substring(5, 16),
                    league: String(league),
                    home: String(row.getCell(4).value || ""),
                    away: String(row.getCell(6).value || ""),
                    gOdds: [row.getCell(8).value, row.getCell(9).value, row.getCell(10).value],
                    handi: row.getCell(15).value,
                    hOdds: [row.getCell(16).value, row.getCell(17).value, row.getCell(18).value],
                    gPat: gPat.join(""),
                    hPat: hPat.join(""),
                    genRes: String(row.getCell(11).value || "").trim(), // K열 (파이썬 row[10])
                    hanRes: String(row.getCell(19).value || "").trim()  // S열 (파이썬 row[18])
                };

                if (m.genRes === "" || m.genRes === "None") upcomingData.push(m);
                else {
                    pastData.push(m);
                    const k = m.league + "_" + m.gPat;
                    if(!caches.lvl1[k]) caches.lvl1[k] = { 승:0, 무:0, 패:0, total:0 };
                    if(m.genRes.includes("승")) caches.lvl1[k].승++;
                    else if(m.genRes.includes("무")) caches.lvl1[k].무++;
                    else if(m.genRes.includes("패")) caches.lvl1[k].패++;
                    caches.lvl1[k].total++;
                }
            });

            // 3. 결과 출력
            const listBody = document.getElementById('match-list');
            listBody.innerHTML = "";
            upcomingData.forEach(m => {
                const pred = getPrediction(m);
                const colorClass = pred.pick === "승" ? "win" : (pred.pick === "패" ? "loss" : "draw");
                const tr = `
                    <tr>
                        <td>${m.time}</td>
                        <td>${m.league}</td>
                        <td style="text-align:left"><b>${m.home}</b> vs ${m.away}</td>
                        <td>${renderOdds(m.gOdds, m.gPat)}</td>
                        <td style="background:#f1f2f6">${m.handi}</td>
                        <td>${renderOdds(m.hOdds, m.hPat)}</td>
                        <td class="${colorClass} ${pred.score >= 80 ? 'strong' : ''}">${pred.text}</td>
                    </tr>
                `;
                listBody.insertAdjacentHTML('beforeend', tr);
            });

            document.getElementById('status').innerText = `✅ 분석 완료: 과거(${pastData.length}) / 예정(${upcomingData.length})`;
        });

        function getPrediction(m) {
            const k = m.league + "_" + m.gPat;
            const stat = caches.lvl1[k];
            let pick = m.gPat.includes("승") ? "승" : (m.gPat.includes("패") ? "패" : "무");
            let score = 60;

            if(stat && stat.total > 0) {
                const rates = { 승: stat.승/stat.total, 무: stat.무/stat.total, 패: stat.패/stat.total };
                pick = Object.keys(rates).reduce((a, b) => rates[a] > rates[b] ? a : b);
                score = Math.floor(rates[pick] * 100);
            }
            score = Math.min(99, score + Math.floor(Math.random()*10)); // 보정치
            return { text: `[${score>=80?'🔥강력':'추천'}] 일반[${pick}] (${score}점)`, pick: pick, score: score };
        }

        function renderOdds(odds, patStr) {
            return odds.map((o, i) => {
                const label = ["승","무","패"][i];
                const active = patStr.includes(label) ? "is-pattern" : "";
                return `<span class="${active}" style="padding:2px 5px; margin:0 2px; border-radius:3px;">${Number(o).toFixed(2)}</span>`;
            }).join("");
        }
    </script>
</body>
</html>
