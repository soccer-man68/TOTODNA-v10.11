<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일에서 화면 비율을 자동으로 맞춰주는 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOTO_DNA v10.11 Mobile</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        :root { --bg: #2c3e50; --green: #27ae60; --purple: #8e44ad; --yellow: #f1c40f; --red: #e74c3c; --dark: #1e272e; }
        
        /* 기본 폰트 크기 상향 (모바일 가독성) */
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; background: #f4f7f6; font-size: 14px; -webkit-text-size-adjust: none; }
        
        /* 암호 레이어 (모바일에서 크게 보이게) */
        #password-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; padding: 20px; }
        #password-overlay h2 { color: white; font-size: 1.8rem; margin-bottom: 30px; }
        #password-overlay input { padding: 18px; font-size: 1.2rem; text-align: center; border-radius: 8px; border: none; margin-bottom: 15px; width: 100%; max-width: 300px; }
        #password-overlay button { padding: 15px; font-size: 1.2rem; background: var(--green); color: white; border: none; border-radius: 8px; width: 100%; max-width: 300px; font-weight: bold; }

        /* 헤더 (버튼들이 스마트폰에서 줄바꿈 되도록) */
        header { background: var(--bg); color: white; padding: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
        .logo { font-size: 1.4rem; font-weight: bold; color: var(--yellow); width: 100%; margin-bottom: 10px; }
        .btn { padding: 10px 14px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 13px; flex: 1; min-width: 120px; }
        
        /* 탭 메뉴 (모바일에서 옆으로 스크롤 가능하게) */
        .tabs { display: flex; background: #dfe6e9; overflow-x: auto; white-space: nowrap; border-bottom: 2px solid #bdc3c7; }
        .tab { padding: 12px 20px; cursor: pointer; background: #b2bec3; margin-right: 2px; font-weight: bold; flex-shrink: 0; }
        .tab.active { background: white; color: var(--bg); border-bottom: 3px solid var(--green); }
        
        /* 테이블 영역 (옆으로 밀어서 보기) */
        .content-area { display: none; padding: 0; height: calc(100vh - 180px); overflow: auto; background: white; }
        .content-area.active { display: block; }
        .table-wrapper { overflow-x: auto; width: 100%; } /* 표가 화면보다 크면 스크롤 */
        
        table { width: 100%; border-collapse: collapse; white-space: nowrap; font-family: 'Consolas', monospace; }
        th { background: #34495e; color: white; padding: 12px 8px; position: sticky; top: 0; z-index: 10; font-size: 13px; }
        td { border: 1px solid #dfe6e9; padding: 10px 8px; text-align: center; font-size: 13px; }
        
        /* 결과 강조 */
        .win { color: #0984e3; font-weight: bold; }
        .draw { color: #00b894; font-weight: bold; }
        .loss { color: #d63031; font-weight: bold; }
        .is-pattern { background-color: #D6EAF8; font-weight: bold; padding: 2px 4px; border-radius: 4px; }
        .strong-pick { background: #eb4d4b !important; color: white !important; padding: 3px 6px; border-radius: 4px; font-weight: bold; }
        
        /* 티어 결과 (모바일 최적화 카드) */
        .tier-card { border-left: 6px solid #00d2d3; background: #2d3436; padding: 15px; margin: 10px; color: #ecf0f1; border-radius: 8px; }
        .tier-title { color: #f1c40f; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
        .combo-box { border-top: 1px solid #444; padding-top: 10px; margin-top: 10px; font-size: 0.9rem; line-height: 1.6; }
        
        /* 하단 상태바 */
        #status { width: 100%; font-size: 12px; color: var(--yellow); margin-top: 5px; }

        /* 모달 팝업 */
        #modal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width: 90%; max-width: 400px; background:white; z-index:2000; padding:20px; border-radius:12px; }
    </style>
</head>
<body>

    <div id="password-overlay">
        <h2>TOTO_DNA v10.11</h2>
        <input type="password" id="pw-input" placeholder="비밀번호 입력">
        <button onclick="checkPw()">시스템 시작</button>
    </div>

    <header>
        <div class="logo">TOTO_DNA DNA</div>
        <button class="btn" style="background:var(--green);" onclick="document.getElementById('file-input').click()">📊 데이터 분석</button>
        <button class="btn" style="background:var(--purple);" onclick="runSimulation()">🧪 성능 검증</button>
        <div id="status">파일을 선택해주세요.</div>
        <input type="file" id="file-input" style="display:none" accept=".xlsx">
    </header>

    <div class="tabs">
        <div class="tab active" onclick="switchTab(0)">전체 경기</div>
        <div class="tab" onclick="switchTab(1)">승무패</div>
        <div class="tab" onclick="switchTab(2)">🔥 3.4.5 티어</div>
    </div>

    <div id="tab0" class="content-area active">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>시간</th><th>리그</th><th>경기 정보</th><th>일반배당 패턴</th><th>H</th><th>핸디배당</th><th>AI 예측 결과</th>
                    </tr>
                </thead>
                <tbody id="list-all"></tbody>
            </table>
        </div>
    </div>

    <div id="tab1" class="content-area">
        <div class="table-wrapper"><table id="list-smp"></table></div>
    </div>

    <div id="tab2" class="content-area" style="background:var(--dark);">
        <div id="tier-results"></div>
    </div>

    <script>
        let normalBgColor = null, pastData = [], upcomingData = [], caches = { lvl1: {}, lvl2: {}, lvl3: {} }, teamHistory = {};

        function checkPw() {
            if(document.getElementById('pw-input').value === "4938") document.getElementById('password-overlay').style.display='none';
        }

        function switchTab(idx) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i===idx));
            document.querySelectorAll('.content-area').forEach((c, i) => c.classList.toggle('active', i===idx));
        }

        function getColorKey(cell) {
            if (!cell || !cell.fill || !cell.fill.fgColor) return "NO_FILL";
            const fg = cell.fill.fgColor;
            if (fg.argb) return "R" + fg.argb;
            if (fg.theme !== undefined) return "T" + fg.theme + "_" + (fg.tint || 0);
            return "NO_FILL";
        }

        function getCombinations(array, size) {
            const result = [];
            function backtrack(start, combo) {
                if (combo.length === size) { result.push([...combo]); return; }
                for (let i = start; i < array.length; i++) {
                    combo.push(array[i]); backtrack(i + 1, combo); combo.pop();
                }
            }
            backtrack(0, []);
            return result;
        }

        document.getElementById('file-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            document.getElementById('status').innerText = "⚙️ 분석중... (갤럭시 최적화 가동)";
            const workbook = new ExcelJS.Workbook();
            await workbook.xlsx.load(file);
            const ws = workbook.getWorksheet('일반핸디') || workbook.worksheets[0];

            const colorCounts = {};
            for(let i=2; i<=100; i++) {
                const c = getColorKey(ws.getRow(i).getCell(8));
                if(c !== "NO_FILL") colorCounts[c] = (colorCounts[c] || 0) + 1;
            }
            normalBgColor = Object.keys(colorCounts).reduce((a, b) => colorCounts[a] > colorCounts[b] ? a : b, "NO_FILL");

            pastData = []; upcomingData = []; teamHistory = {};
            caches = { lvl1: {}, lvl2: {}, lvl3: {} };
            
            ws.eachRow((row, rowNumber) => {
                if(rowNumber < 2) return;
                const league = row.getCell(3).value;
                if(!league) return;

                const getPat = (cols) => {
                    let p = [];
                    cols.forEach((cIdx, i) => {
                        const cell = row.getCell(cIdx);
                        if(getColorKey(cell) !== normalBgColor && getColorKey(cell) !== "NO_FILL") p.push(["승","무","패"][i]);
                    });
                    return p;
                };

                const m = {
                    time: String(row.getCell(2).value || "").substring(5,16),
                    league: String(league),
                    home: String(row.getCell(4).value || ""),
                    away: String(row.getCell(6).value || ""),
                    gOdds: [row.getCell(8).value, row.getCell(9).value, row.getCell(10).value],
                    handi: row.getCell(15).value,
                    hOdds: [row.getCell(16).value, row.getCell(17).value, row.getCell(18).value],
                    gPat: getPat([8, 9, 10]).join(""),
                    hPat: getPat([16, 17, 18]).join(""),
                    genRes: String(row.getCell(11).value || "").trim(),
                    hanRes: String(row.getCell(19).value || "").trim(),
                    isSmp: (getColorKey(row.getCell(3)) !== "NO_FILL" && getColorKey(row.getCell(3)) !== normalBgColor)
                };

                if(m.genRes === "" || m.genRes === "None") upcomingData.push(m);
                else {
                    pastData.push(m);
                    const resKey = `${m.genRes}_${m.hanRes}`;
                    const k1 = `${m.league}_${m.handi}_${m.gPat}`, k2 = `${m.league}_${m.gPat}`, k3 = `${m.gPat}_${m.hPat}`;
                    [ [caches.lvl1, k1], [caches.lvl2, k2], [caches.lvl3, k3] ].forEach(([cache, k]) => {
                        if(!cache[k]) cache[k] = {};
                        cache[k][resKey] = (cache[k][resKey] || 0) + 1;
                    });
                    if(!teamHistory[m.home]) teamHistory[m.home] = [];
                    if(!teamHistory[m.away]) teamHistory[m.away] = [];
                    teamHistory[m.home].push(m.genRes);
                    const rev = { "승":"패", "패":"승", "무":"무" };
                    teamHistory[m.away].push(rev[m.genRes] || "무");
                }
            });

            renderAll();
            generateTierCombos();
            document.getElementById('status').innerText = `✅ 완료: 과거(${pastData.length}) / 예정(${upcomingData.length})`;
        });

        function getMomentumScore(team) {
            const recent = (teamHistory[team] || []).slice(-6);
            let score = 0;
            recent.forEach((res, i) => {
                const weight = (i + 1) * 0.3;
                if(res === "승") score += 3 * weight;
                else if(res === "무") score += 1 * weight;
            });
            return Number(score.toFixed(1));
        }

        function getPredictionAI(m) {
            let points = {};
            let totalHits = 0;
            const analysisLevels = [
                [caches.lvl1, 20.0, `${m.league}_${m.handi}_${m.gPat}`],
                [caches.lvl2, 10.0, `${m.league}_${m.gPat}`],
                [caches.lvl3, 5.0, `${m.gPat}_${m.hPat}`]
            ];

            analysisLevels.forEach(([cache, weight, key]) => {
                const counter = cache[key];
                if(counter) {
                    for(let resKey in counter) {
                        const [gRes, hRes] = resKey.split("_");
                        const count = counter[resKey];
                        totalHits += count;
                        for(let p of m.gPat) if(gRes === p) points[`일반[${p}]`] = (points[`일반[${p}]`] || 0) + weight * count;
                        for(let p of m.hPat) if(hRes === p) points[`핸디[${p}]`] = (points[`핸디[${p}]`] || 0) + weight * count;
                    }
                }
            });

            if(Object.keys(points).length === 0) return { text: "패턴부족", conf: 0 };

            const hMom = getMomentumScore(m.home), aMom = getMomentumScore(m.away);
            if(hMom - aMom >= 5.0 && points["일반[승]"]) points["일반[승]"] *= 1.3;
            else if(hMom - aMom <= -5.0 && points["일반[패]"]) points["일반[패]"] *= 1.3;

            const sorted = Object.entries(points).sort((a,b) => b[1] - a[1]);
            const [bestKey, bestVal] = sorted[0];
            const sumPoints = Object.values(points).reduce((a,b) => a+b, 0);
            let confidence = Math.min(100, Math.floor((bestVal / sumPoints) * 70 + Math.min(totalHits, 25) * 1.2));
            return { text: `${confidence >= 82 ? '🔥강력' : (confidence >= 68 ? '추천' : '일반')} ${bestKey.replace('일반','').replace('핸디','')} (${confidence})`, key: bestKey, conf: confidence };
        }

        function generateTierCombos() {
            const container = document.getElementById('tier-results');
            container.innerHTML = `<h2 style="color:var(--yellow); text-align:center; font-size:1.4rem;">🚀 Multi-Tier Engine</h2>`;
            
            const candidates = upcomingData.map(m => {
                const p = getPredictionAI(m);
                let oddsVal = 0;
                if(p.conf >= 62) {
                    const pick = p.key.split('[')[1][0];
                    const idx = pick === "승" ? 0 : (pick === "무" ? 1 : 2);
                    oddsVal = p.key.includes("일반") ? Number(m.gOdds[idx]) : Number(m.hOdds[idx]);
                }
                return { m, p, odds: oddsVal || 0 };
            }).filter(c => c.odds > 1.05).sort((a,b) => b.p.conf - a.p.conf).slice(0, 15);

            const findCombos = (count, minO, maxO, label) => {
                let html = `<div class="tier-card"><div class="tier-title">${label}</div>`;
                const allCombos = getCombinations(candidates, count);
                const found = [];
                allCombos.forEach(combo => {
                    const totalO = combo.reduce((a, b) => a * b.odds, 1);
                    const avgConf = combo.reduce((a, b) => a + b.p.conf, 0) / count;
                    if(totalO >= minO && totalO <= maxO) found.push({combo, totalO, avgConf});
                });
                found.sort((a, b) => b.avgConf - a.avgConf);
                if(found.length === 0) html += `조합 없음`;
                else {
                    found.slice(0, 1).forEach(f => {
                        html += `<div class="combo-box">★ <span class="odds-val">${f.totalO.toFixed(2)}배</span><br>`;
                        f.combo.forEach(c => html += ` > ${c.m.home} [${c.p.key.replace('일반','').replace('핸디','')}] (${c.odds.toFixed(2)})<br>`);
                        html += `</div>`;
                    });
                }
                container.insertAdjacentHTML('beforeend', html + `</div>`);
            };

            findCombos(3, 5.0, 15.0, "TIER 1 (안정형)");
            findCombos(4, 16.0, 30.0, "TIER 2 (전략형)");
            findCombos(5, 31.0, 99.0, "TIER 3 (잭팟형)");
        }

        function renderAll() {
            const listAll = document.getElementById('list-all');
            const listSmp = document.getElementById('list-smp');
            listAll.innerHTML = ""; listSmp.innerHTML = "";

            upcomingData.forEach((m) => {
                const pred = getPredictionAI(m);
                const colorClass = pred.key?.includes("승") ? "win" : (pred.key?.includes("패")?"loss":"draw");
                const html = `
                    <tr>
                        <td>${m.time}</td>
                        <td><span class="${m.isSmp?'smp-league':''}">${m.league.substring(0,5)}</span></td>
                        <td style="text-align:left">${m.home} vs ${m.away}</td>
                        <td>${renderOdds(m.gOdds, m.gPat)}</td>
                        <td>${m.handi}</td>
                        <td>${renderOdds(m.hOdds, m.hPat)}</td>
                        <td class="${pred.conf>=82?'strong-pick':colorClass}">${pred.text}</td>
                    </tr>
                `;
                listAll.insertAdjacentHTML('beforeend', html);
                if(m.isSmp) listSmp.insertAdjacentHTML('beforeend', html);
            });
        }

        function renderOdds(odds, patStr) {
            return odds.map((o, i) => {
                const label = ["승","무","패"][i];
                const active = patStr.includes(label) ? "is-pattern" : "";
                return `<span class="${active}">${o?Number(o).toFixed(2):'0.0'}</span>`;
            }).join(" ");
        }

        function runSimulation() {
            const samples = pastData.slice(-50);
            let hits = 0;
            samples.forEach(m => {
                const p = getPredictionAI(m);
                if(p.key && (m.genRes === p.key.split('[')[1][0])) hits++;
            });
            alert(`최근 50경기 적중률: ${(hits/samples.length*100).toFixed(1)}%`);
        }
    </script>
</body>
</html>
