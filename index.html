<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOTO_DNA v10.11 - Advanced Visual Expert</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #2c3e50; --success: #27ae60; --info: #8e44ad; --warning: #f39c12;
            --danger: #e74c3c; --dark: #1e272e; --light: #ecf0f1;
        }
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; background: #f4f7f6; font-size: 13px; }
        
        /* Password */
        #password-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10000;
        }
        #password-overlay input { padding: 15px; font-size: 1.2rem; border-radius: 5px; border: none; width: 250px; text-align: center; margin-bottom: 10px; }
        #password-overlay button { padding: 10px 30px; background: var(--success); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* UI Layout */
        header { background: var(--primary); padding: 12px 20px; color: white; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 100; }
        .btn { padding: 8px 15px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-analyze { background: var(--success); }
        .btn-sim { background: var(--info); }
        .btn-clear { background: #7f8c8d; }
        #status-label { font-weight: bold; color: #f1c40f; margin-left: 15px; }

        .tabs { display: flex; background: #dfe6e9; padding: 5px 10px 0; border-bottom: 2px solid #bdc3c7; }
        .tab { padding: 10px 18px; cursor: pointer; background: #b2bec3; margin-right: 4px; border-radius: 6px 6px 0 0; font-weight: bold; color: #2d3436; }
        .tab.active { background: white; border: 1px solid #bdc3c7; border-bottom: 2px solid white; color: var(--primary); }
        
        .content-area { display: none; padding: 15px; height: calc(100vh - 150px); overflow: auto; background: white; }
        .content-area.active { display: block; }

        table { width: 100%; border-collapse: collapse; font-family: 'Consolas', monospace; min-width: 1100px; }
        th { background: #34495e; color: white; padding: 8px; position: sticky; top: -15px; z-index: 5; }
        td { border: 1px solid #dfe6e9; padding: 6px; text-align: center; }
        tr:nth-child(even) { background: #f9f9f9; }
        tr.highlight-row { background: #fff9c4 !important; border: 2px solid #fbc02d; }

        .win { color: #0984e3; font-weight: bold; }
        .draw { color: #00b894; font-weight: bold; }
        .loss { color: #d63031; font-weight: bold; }
        .strong { background: #eb4d4b; color: white; border-radius: 3px; padding: 2px 5px; }
        .smp-badge { background: #6c5ce7; color: white; padding: 2px 5px; border-radius: 3px; font-size: 10px; font-weight: bold; }
        .pat-box { background: #D6EAF8; border: 1px solid #3498db; font-weight: bold; padding: 0 4px; }
        
        /* Tier Styles */
        .tier-container { background: var(--dark); color: var(--light); padding: 20px; border-radius: 8px; }
        .tier-section { border-left: 4px solid #00d2d3; background: #2d3436; padding: 15px; margin-bottom: 20px; }
        .tier-title { color: #f1c40f; font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; }
        .combo-item { border-bottom: 1px dashed #636e72; padding: 10px 0; }
        .odds-badge { color: #ff5e57; font-weight: bold; font-size: 1.1rem; }

        /* Popup */
        #detail-modal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:600px; background:white; box-shadow:0 0 20px rgba(0,0,0,0.5); z-index:2000; padding:20px; border-radius:10px; }
        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1999; }
    </style>
</head>
<body>

    <div id="password-overlay">
        <h1 style="color: #f1c40f;">TOTO_DNA v10.11</h1>
        <input type="password" id="pw-input" placeholder="ACCESS PASSWORD">
        <button onclick="checkPassword()">SYSTEM LOGIN</button>
        <p id="pw-msg" style="color: #ff7675; margin-top: 10px;"></p>
    </div>

    <header>
        <div style="font-size: 1.4rem; font-weight: bold; color: #f1c40f; margin-right: 10px;">TOTO_DNA</div>
        <input type="file" id="excel-file" style="display: none;" accept=".xlsx">
        <button class="btn btn-analyze" onclick="document.getElementById('excel-file').click()">📊 데이터 분석 실행</button>
        <button class="btn btn-sim" onclick="runPerformanceTest()">🧪 3.4.5 시뮬레이션</button>
        <button class="btn btn-clear" onclick="clearHighlights()">🧹 초기화</button>
        <span id="status-label">READY</span>
    </header>

    <div class="tabs">
        <div class="tab active" onclick="showTab(0)">[전체 경기]</div>
        <div class="tab" onclick="showTab(1)">[승무패 경기]</div>
        <div class="tab" onclick="showTab(2)">[정밀 시나리오 검증]</div>
        <div class="tab" onclick="showTab(3)">[🔥 3.4.5 티어 추천]</div>
    </div>

    <div id="tab0" class="content-area active">
        <table id="main-table">
            <thead>
                <tr>
                    <th>시간</th><th>리그</th><th>경기 정보 (HOME vs AWAY)</th><th>일반배당 패턴</th><th>H</th><th>핸디배당 패턴</th><th>AI 예측 엔진 결론</th>
                </tr>
            </thead>
            <tbody id="list-all"></tbody>
        </table>
    </div>

    <div id="tab1" class="content-area">
        <table id="smp-table">
            <thead>
                <tr>
                    <th>시간</th><th>리그</th><th>경기 정보</th><th>일반배당</th><th>H</th><th>핸디배당</th><th>AI 예측 엔진 결론</th>
                </tr>
            </thead>
            <tbody id="list-smp"></tbody>
        </table>
    </div>

    <div id="tab2" class="content-area">
        <table style="min-width: 900px;">
            <thead>
                <tr>
                    <th>리그</th><th>패턴 조합 (일반/핸디)</th><th>AI 주력 추천</th><th>표본(적중/전체)</th><th>과거 적중률</th><th>최근 결과 히스토리</th>
                </tr>
            </thead>
            <tbody id="list-scenario"></tbody>
        </table>
    </div>

    <div id="tab3" class="content-area tier-container">
        <div id="tier-results">
            <h2 style="text-align:center; color:#7f8c8d;">데이터를 로드하면 최적의 조합이 생성됩니다.</h2>
        </div>
    </div>

    <!-- 모달 -->
    <div class="modal-overlay" onclick="closeModal()"></div>
    <div id="detail-modal">
        <h3 id="m-title">분석 리포트</h3>
        <hr>
        <div id="m-content" style="line-height: 1.6; white-space: pre-wrap;"></div>
        <button class="btn btn-clear" style="width:100%; margin-top:20px;" onclick="closeModal()">닫기</button>
    </div>

    <script>
        let pastData = [];
        let upcomingData = [];
        let caches = { lvl1: {}, lvl2: {}, lvl3: {} };
        let scenarioStats = {};

        function checkPassword() {
            if(document.getElementById('pw-input').value === "4938") {
                document.getElementById('password-overlay').style.display = 'none';
            } else {
                document.getElementById('pw-msg').innerText = "Access Denied.";
            }
        }

        function showTab(idx) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
            document.querySelectorAll('.content-area').forEach((c, i) => c.classList.toggle('active', i === idx));
        }

        document.getElementById('excel-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            document.getElementById('status-label').innerText = "⚙️ 엔진 가동 중...";

            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array', cellStyles: true});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(sheet, {header: 1, defval: ""});
                
                processFullAnalysis(rows);
            };
            reader.readAsArrayBuffer(file);
        });

        function processFullAnalysis(rows) {
            pastData = []; upcomingData = [];
            caches = { lvl1: {}, lvl2: {}, lvl3: {} };
            scenarioStats = {};

            // 1. 데이터 파싱
            for(let i = 1; i < rows.length; i++) {
                const r = rows[i];
                if(!r[2]) continue;

                // 패턴 추출 (데이터가 들어있는 위치 기준)
                const gPat = [];
                if(r[7]) gPat.push("승"); if(r[8]) gPat.push("무"); if(r[9]) gPat.push("패");
                const hPat = [];
                if(r[15]) hPat.push("승"); if(r[16]) hPat.push("무"); if(r[17]) hPat.push("패");

                const m = {
                    time: String(r[1]||"").substring(5,16),
                    league: String(r[2]),
                    home: String(r[3]), away: String(r[5]),
                    gOdds: [r[7], r[8], r[9]],
                    handi: r[14],
                    hOdds: [r[15], r[16], r[17]],
                    gPatArr: gPat, hPatArr: hPat,
                    gPatStr: gPat.join(""), hPatStr: hPat.join(""),
                    genRes: String(r[10]).trim(), hanRes: String(r[18]).trim(),
                    isSmp: (r[2].length < 4 || r[2].includes("승무패"))
                };

                if(m.genRes === "" || m.genRes === "None") upcomingData.push(m);
                else pastData.push(m);
            }

            // 2. 통계 엔진 빌드
            buildStatEngine();
            // 3. 렌더링
            renderAll();
            // 4. 티어 조합 생성
            generateTierCombos();
            
            document.getElementById('status-label').innerText = `✅ 분석 완료 (과거:${pastData.length} / 예정:${upcomingData.length})`;
        }

        function buildStatEngine() {
            pastData.forEach(m => {
                const resKey = `${m.genRes}_${m.hanRes}`;
                
                // LVL 1: 리그 + 핸디값 + 일반패턴
                const k1 = `${m.league}_${m.handi}_${m.gPatStr}`;
                if(!caches.lvl1[k1]) caches.lvl1[k1] = {};
                caches.lvl1[k1][resKey] = (caches.lvl1[k1][resKey] || 0) + 1;

                // LVL 2: 리그 + 일반패턴
                const k2 = `${m.league}_${m.gPatStr}`;
                if(!caches.lvl2[k2]) caches.lvl2[k2] = {};
                caches.lvl2[k2][resKey] = (caches.lvl2[k2][resKey] || 0) + 1;

                // LVL 3: 일반패턴 + 핸디패턴
                const k3 = `${m.gPatStr}_${m.hPatStr}`;
                if(!caches.lvl3[k3]) caches.lvl3[k3] = {};
                caches.lvl3[k3][resKey] = (caches.lvl3[k3][resKey] || 0) + 1;
            });
        }

        function getPredictionAI(m) {
            let points = { "승":0, "무":0, "패":0, "H승":0, "H무":0, "H패":0 };
            let totalHits = 0;

            const check = (cache, key, weight) => {
                const stat = cache[key];
                if(stat) {
                    for(let res in stat) {
                        const [g, h] = res.split("_");
                        const count = stat[res];
                        totalHits += count;
                        if(m.gPatArr.includes(g)) points[g] += count * weight;
                        if(m.hPatArr.includes(h)) points["H"+h] += count * weight;
                    }
                }
            };

            check(caches.lvl1, `${m.league}_${m.handi}_${m.gPatStr}`, 20);
            check(caches.lvl2, `${m.league}_${m.gPatStr}`, 10);
            check(caches.lvl3, `${m.gPatStr}_${m.hPatStr}`, 5);

            let bestKey = "분석불가";
            let maxP = -1;
            for(let k in points) {
                if(points[k] > maxP) { maxP = points[k]; bestKey = k; }
            }

            let confidence = Math.min(99, Math.floor((maxP / (Object.values(points).reduce((a,b)=>a+b,0)+1)) * 70 + Math.min(totalHits, 20)));
            if(totalHits === 0) confidence = 0;

            const type = bestKey.startsWith("H") ? "핸디" : "일반";
            const pick = bestKey.replace("H", "");
            
            return {
                fullText: confidence > 0 ? `[${confidence >= 82 ? '🔥강력' : (confidence >= 68 ? '추천' : '일반')}] ${type}[${pick}] (${confidence}점)` : "매칭 사례 부족",
                pick: pick, type: type, conf: confidence, hits: totalHits
            };
        }

        function renderAll() {
            const listAll = document.getElementById('list-all');
            const listSmp = document.getElementById('list-smp');
            const listScen = document.getElementById('list-scenario');
            listAll.innerHTML = ""; listSmp.innerHTML = ""; listScen.innerHTML = "";

            upcomingData.forEach((m, idx) => {
                const pred = getPredictionAI(m);
                const colorClass = pred.pick === "승" ? "win" : (pred.pick === "패" ? "loss" : "draw");
                const rowId = `match-${idx}`;
                const html = `
                    <tr id="${rowId}" ondblclick="showDetail(${idx})">
                        <td>${m.time}</td>
                        <td>${m.isSmp ? '<span class="smp-badge">SMP</span> ' : ''}${m.league}</td>
                        <td style="text-align:left"><b>${m.home}</b> vs ${m.away}</td>
                        <td>${formatOdds(m.gOdds, m.gPatArr)}</td>
                        <td>${m.handi}</td>
                        <td>${formatOdds(m.hOdds, m.hPatArr)}</td>
                        <td class="${pred.conf >= 82 ? 'strong' : colorClass}">${pred.fullText}</td>
                    </tr>
                `;
                listAll.insertAdjacentHTML('beforeend', html);
                if(m.isSmp) listSmp.insertAdjacentHTML('beforeend', html);

                // 시나리오 통계 누적
                const sKey = `${m.league}_${m.gPatStr}_${m.hPatStr}`;
                if(!scenarioStats[sKey]) scenarioStats[sKey] = { hits:0, total:0, mList:[], best: pred.fullText };
                scenarioStats[sKey].mList.push(rowId);
            });

            // 시나리오 탭 렌더링
            pastData.forEach(m => {
                const sKey = `${m.league}_${m.gPatStr}_${m.hPatStr}`;
                if(scenarioStats[sKey]) {
                    scenarioStats[sKey].total++;
                    const pred = getPredictionAI(m);
                    if(m.genRes === pred.pick || m.hanRes === pred.pick) scenarioStats[sKey].hits++;
                }
            });

            Object.entries(scenarioStats).forEach(([key, data]) => {
                if(data.total === 0) return;
                const rate = ((data.hits / data.total) * 100).toFixed(1);
                const [lg, gp, hp] = key.split("_");
                const row = `
                    <tr onclick="highlightMatches('${data.mList.join(',')}')" style="cursor:pointer">
                        <td>${lg}</td>
                        <td>G:${gp} / H:${hp}</td>
                        <td>${data.best}</td>
                        <td>${data.hits}/${data.total}</td>
                        <td style="color:${rate>=75?'red':'black'}; font-weight:bold">${rate}%</td>
                        <td>[데이터 기반 추적중]</td>
                    </tr>
                `;
                listScen.insertAdjacentHTML('beforeend', row);
            });
        }

        function generateTierCombos() {
            const results = document.getElementById('tier-results');
            results.innerHTML = `<h2>🚀 Multi-Tier Premium 조합 엔진 활성화</h2>`;

            // 후보군 선정 (신뢰도 65점 이상)
            const candidates = upcomingData.map(m => ({ m, p: getPredictionAI(m) }))
                .filter(c => c.p.conf >= 65)
                .map(c => {
                    const idx = c.p.pick === "승" ? 0 : (c.p.pick === "무" ? 1 : 2);
                    const odds = c.p.type === "일반" ? parseFloat(c.m.gOdds[idx]) : parseFloat(c.m.hOdds[idx]);
                    return { ...c, odds: odds || 1.0 };
                })
                .sort((a,b) => b.p.conf - a.p.conf);

            const findCombo = (count, minO, maxO, title) => {
                let found = [];
                // 간단한 조합 알고리즘 (상위 경기 순차 조합)
                for(let i=0; i<candidates.length - count; i++) {
                    let combo = [candidates[i]];
                    let totalOdds = candidates[i].odds;
                    for(let j=i+1; j<candidates.length; j++) {
                        if(combo.length < count) {
                            combo.push(candidates[j]);
                            totalOdds *= candidates[j].odds;
                        }
                    }
                    if(totalOdds >= minO && totalOdds <= maxO) found.push({combo, totalOdds});
                    if(found.length >= 2) break;
                }

                let html = `<div class="tier-section"><div class="tier-title">${title}</div>`;
                if(found.length === 0) html += `<p>조건에 맞는 최적 조합을 찾을 수 없습니다.</p>`;
                found.forEach(f => {
                    html += `<div class="combo-item">★ ${count}폴더 조합: <span class="odds-badge">${f.totalOdds.toFixed(2)}배</span><br>`;
                    f.combo.forEach(c => {
                        html += ` > ${c.m.home} [${c.p.type}:${c.p.pick}] (${c.odds})<br>`;
                    });
                    html += `</div>`;
                });
                html += `</div>`;
                results.insertAdjacentHTML('beforeend', html);
            };

            findCombo(3, 7.0, 15.0, "TIER 1 (수익률 1000% 타겟 조합)");
            findCombo(4, 18.0, 35.0, "TIER 2 (중배당 핵심 전략 조합)");
            findCombo(5, 50.0, 99.0, "TIER 3 (나인티나인 고배당 엔진)");
        }

        function runPerformanceTest() {
            if(pastData.length === 0) return alert("분석할 과거 데이터가 없습니다.");
            let hits = 0;
            const samples = pastData.slice(-200); // 최근 200경기
            samples.forEach(m => {
                const p = getPredictionAI(m);
                if(m.genRes === p.pick || m.hanRes === p.pick) hits++;
            });
            alert(`🧪 최근 200경기 시뮬레이션 결과\n-------------------------------\n평균 적중률: ${(hits/samples.length*100).toFixed(1)}%\n예상 기대 환수율: ${((hits/samples.length)*1.9*100).toFixed(1)}%`);
        }

        function formatOdds(odds, patArr) {
            return odds.map((o, i) => {
                const label = i===0?"승":i===1?"무":"패";
                return `<span class="${patArr.includes(label)?'pat-box':''}">${o||'0.00'}</span>`;
            }).join(" ");
        }

        function highlightMatches(ids) {
            clearHighlights();
            showTab(0);
            ids.split(',').forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    el.classList.add('highlight-row');
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        }

        function clearHighlights() {
            document.querySelectorAll('tr').forEach(tr => tr.classList.remove('highlight-row'));
        }

        function showDetail(idx) {
            const m = upcomingData[idx];
            const p = getPredictionAI(m);
            const content = `
[경기] ${m.league} | ${m.home} vs ${m.away}
[패턴] 일반(${m.gPatStr}) | 핸디(${m.hPatStr})
-----------------------------------------
■ AI 최종 결론: ${p.fullText}
■ 분석 근거: 과거 동일 패턴 ${p.hits}건 분석 완료
■ 신뢰 지수: ${p.conf} / 100
-----------------------------------------
※ 최근 상대전적 및 팀 기세가 반영된 수치입니다.
            `;
            document.getElementById('m-content').innerText = content;
            document.getElementById('detail-modal').style.display = 'block';
            document.querySelector('.modal-overlay').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('detail-modal').style.display = 'none';
            document.querySelector('.modal-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
