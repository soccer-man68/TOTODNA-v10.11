<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOTO_DNA v10.11 Perfect Sync</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        :root { --bg: #2c3e50; --green: #27ae60; --purple: #8e44ad; --yellow: #f1c40f; --red: #e74c3c; --dark: #1e272e; }
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; background: #f4f7f6; font-size: 14px; -webkit-text-size-adjust: none; }
        
        /* 모바일 헤더 */
        header { background: var(--bg); color: white; padding: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 1.3rem; font-weight: bold; color: var(--yellow); width: 100%; margin-bottom: 8px; }
        .btn { padding: 10px; border: none; border-radius: 6px; color: white; font-weight: bold; font-size: 13px; flex: 1; min-width: 100px; cursor: pointer; }
        
        /* 탭 메뉴 (모바일 스크롤) */
        .tabs { display: flex; background: #dfe6e9; overflow-x: auto; border-bottom: 2px solid #bdc3c7; position: sticky; top: 85px; z-index: 999; }
        .tab { padding: 12px 18px; cursor: pointer; background: #b2bec3; white-space: nowrap; font-weight: bold; border-right: 1px solid #ccc; }
        .tab.active { background: white; color: var(--bg); border-bottom: 4px solid var(--green); }
        
        /* 메인 리스트 (가로 스크롤) */
        .content-area { display: none; padding: 0; height: calc(100vh - 170px); overflow: auto; }
        .content-area.active { display: block; }
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        
        table { width: 100%; border-collapse: collapse; white-space: nowrap; font-family: 'Consolas', monospace; }
        th { background: #34495e; color: white; padding: 12px 8px; font-size: 13px; position: sticky; top: 0; }
        td { border: 1px solid #dfe6e9; padding: 10px 8px; text-align: center; font-size: 13px; }
        
        /* 신뢰도 및 결과 색상 */
        .win { color: #0984e3; font-weight: bold; }
        .draw { color: #00b894; font-weight: bold; }
        .loss { color: #d63031; font-weight: bold; }
        .is-pattern { background-color: #D6EAF8; font-weight: bold; padding: 2px 4px; border-radius: 4px; border: 1px solid #3498db; }
        .strong-pick { background: #eb4d4b !important; color: white !important; font-weight: bold; border-radius: 4px; padding: 3px 6px; }
        
        /* 티어 추천 카드 */
        .tier-card { border-left: 6px solid #00d2d3; background: #2d3436; padding: 15px; margin: 12px; color: #ecf0f1; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .tier-title { color: #f1c40f; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
        .combo-box { border-top: 1px solid #444; padding-top: 10px; margin-top: 10px; font-size: 0.95rem; line-height: 1.7; }
        .odds-val { color: #ff5e57; font-weight: bold; font-size: 1.2rem; }

        /* 상태 메세지 */
        #status { width: 100%; font-size: 12px; color: var(--yellow); }
        
        /* 암호 레이어 - 버튼 크기 수정 */
        #password-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10001; padding: 30px; }
        #pw-input { padding: 15px; font-size: 1.2rem; width: 100%; max-width: 280px; border-radius: 8px; border: none; margin-bottom: 15px; text-align: center; outline: none; }
        .btn-pw { width: 160px; padding: 12px; background: var(--green); font-size: 15px; border-radius: 50px; flex: none; }
        
        /* 모달 (정밀 리포트) */
        #modal { display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width: 90%; background:white; z-index:2000; padding:20px; border-radius:12px; max-height: 80vh; overflow-y: auto; }
        .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:1999; }
    </style>
</head>
<body>

    <div id="password-overlay">
        <h2 style="color:white; margin-bottom: 20px;">TOTO_DNA v10.11</h2>
        <input type="password" id="pw-input" placeholder="비밀번호 입력">
        <button class="btn btn-pw" onclick="checkPw()">시스템 접속</button>
    </div>

    <header>
        <div class="logo">TOTO_DNA v10.11</div>
        <button class="btn" style="background:var(--green);" onclick="document.getElementById('file-input').click()">📊 데이터 분석</button>
        <button class="btn" style="background:var(--purple);" onclick="runSimulation()">🧪 적중 시뮬</button>
        <div id="status">파일을 로드해주세요.</div>
        <input type="file" id="file-input" style="display:none" accept=".xlsx">
    </header>

    <div class="tabs">
        <div class="tab active" onclick="switchTab(0)">[전체 경기]</div>
        <div class="tab" onclick="switchTab(1)">[승무패 경기]</div>
        <div class="tab" onclick="switchTab(2)">[🔥 3.4.5 티어]</div>
    </div>

    <div id="tab0" class="content-area active">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>시간</th><th>리그</th><th>경기 정보</th><th>일반배당</th><th>H</th><th>핸디배당</th><th>AI 예측 결과</th>
                    </tr>
                </thead>
                <tbody id="list-all"></tbody>
            </table>
        </div>
    </div>

    <div id="tab1" class="content-area">
        <div class="table-wrapper"><table id="list-smp"></table></div>
    </div>

    <div id="tab2" class="content-area" style="background:var(--dark);">
        <div id="tier-results"></div>
    </div>

    <!-- 모달 -->
    <div class="overlay" onclick="closeModal()"></div>
    <div id="modal">
        <h3 style="margin-top:0;">🔍 정밀 분석 리포트</h3>
        <div id="m-content" style="white-space: pre-wrap; font-size: 13px; line-height: 1.6;"></div>
        <button class="btn" style="background:var(--bg); width:100%; margin-top:15px;" onclick="closeModal()">닫기</button>
    </div>

    <script>
        let normalBgColor = null, pastData = [], upcomingData = [], caches = { lvl1: {}, lvl2: {}, lvl3: {} }, teamHistory = {};

        function checkPw() {
            if(document.getElementById('pw-input').value === "4938") document.getElementById('password-overlay').style.display='none';
        }

        function switchTab(idx) {
            document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i===idx));
            document.querySelectorAll('.content-area').forEach((c, i) => c.classList.toggle('active', i===idx));
        }

        function getColorKey(cell) {
            if (!cell || !cell.fill || !cell.fill.fgColor) return "NO_FILL";
            const fg = cell.fill.fgColor;
            if (fg.argb) return "R" + fg.argb;
            if (fg.theme !== undefined) return "T" + fg.theme + "_" + (fg.tint || 0);
            return "NO_FILL";
        }

        function getCombinations(array, size) {
            const result = [];
            function backtrack(start, combo) {
                if (combo.length === size) { result.push([...combo]); return; }
                for (let i = start; i < array.length; i++) {
                    combo.push(array[i]); backtrack(i + 1, combo); combo.pop();
                }
            }
            backtrack(0, []);
            return result;
        }

        document.getElementById('file-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if(!file) return;
            document.getElementById('status').innerText = "⚙️ 파이썬 로직 동기화 중...";
            const workbook = new ExcelJS.Workbook();
            await workbook.xlsx.load(file);
            const ws = workbook.getWorksheet('일반핸디') || workbook.worksheets[0];

            const colorCounts = {};
            for(let i=2; i<=100; i++) {
                const cell = ws.getRow(i).getCell(8);
                const c = getColorKey(cell);
                if(c !== "NO_FILL") colorCounts[c] = (colorCounts[c] || 0) + 1;
            }
            normalBgColor = Object.keys(colorCounts).reduce((a, b) => colorCounts[a] > colorCounts[b] ? a : b, "NO_FILL");

            pastData = []; upcomingData = []; teamHistory = {};
            caches = { lvl1: {}, lvl2: {}, lvl3: {} };
            
            ws.eachRow((row, rowNumber) => {
                if(rowNumber < 2) return;
                const league = row.getCell(3).value;
                if(!league) return;

                const getPat = (cols) => {
                    let p = [];
                    cols.forEach((cIdx, i) => {
                        const cell = row.getCell(cIdx);
                        if(getColorKey(cell) !== normalBgColor && getColorKey(cell) !== "NO_FILL") p.push(["승","무","패"][i]);
                    });
                    return p;
                };

                const gPatArr = getPat([8, 9, 10]);
                const hPatArr = getPat([16, 17, 18]);

                const m = {
                    time: String(row.getCell(2).value || "").substring(5,16),
                    league: String(league),
                    home: String(row.getCell(4).value || "").trim(),
                    away: String(row.getCell(6).value || "").trim(),
                    gOdds: [row.getCell(8).value, row.getCell(9).value, row.getCell(10).value],
                    handi: row.getCell(15).value,
                    hOdds: [row.getCell(16).value, row.getCell(17).value, row.getCell(18).value],
                    gPat: gPatArr.join(""),
                    hPat: hPatArr.join(""),
                    gPatTuple: gPatArr,
                    hPatTuple: hPatArr,
                    genRes: String(row.getCell(11).value || "").trim(),
                    hanRes: String(row.getCell(19).value || "").trim(),
                    isSmp: (getColorKey(row.getCell(3)) !== "NO_FILL" && getColorKey(row.getCell(3)) !== normalBgColor)
                };

                if(m.genRes === "" || m.genRes === "None" || m.genRes === "undefined") upcomingData.push(m);
                else {
                    pastData.push(m);
                    const resKey = `${m.genRes}_${m.hanRes}`;
                    const k1 = `${m.league}_${m.handi}_${m.gPat}`, k2 = `${m.league}_${m.gPat}`, k3 = `${m.gPat}_${m.hPat}`;
                    [ [caches.lvl1, k1], [caches.lvl2, k2], [caches.lvl3, k3] ].forEach(([cache, k]) => {
                        if(!cache[k]) cache[k] = {};
                        cache[k][resKey] = (cache[k][resKey] || 0) + 1;
                    });
                    if(!teamHistory[m.home]) teamHistory[m.home] = [];
                    if(!teamHistory[m.away]) teamHistory[m.away] = [];
                    teamHistory[m.home].push(m.genRes);
                    const rev = { "승":"패", "패":"승", "무":"무" };
                    teamHistory[m.away].push(rev[m.genRes] || "무");
                }
            });

            renderAll();
            generateTierCombos();
            document.getElementById('status').innerText = `✅ 완료: 과거(${pastData.length}) / 예정(${upcomingData.length})`;
        });

        function getMomentumScore(team) {
            const recent = (teamHistory[team] || []).slice(-6);
            let score = 0;
            recent.forEach((res, i) => {
                const weight = (i + 1) * 0.3;
                if(res === "승") score += 3 * weight;
                else if(res === "무") score += 1 * weight;
            });
            return { score: Number(score.toFixed(1)), history: recent };
        }

        function getPredictionAI(m) {
            if(!m.gPat && !m.hPat) return { text: "패턴 데이터 부족", conf: 0 };
            let points = {}; let totalHits = 0;
            const analysisLevels = [ [caches.lvl1, 20.0, `${m.league}_${m.handi}_${m.gPat}`], [caches.lvl2, 10.0, `${m.league}_${m.gPat}`], [caches.lvl3, 5.0, `${m.gPat}_${m.hPat}`] ];

            analysisLevels.forEach(([cache, weight, key]) => {
                const counter = cache[key];
                if(counter) {
                    for(let resKey in counter) {
                        const [gRes, hRes] = resKey.split("_");
                        const count = counter[resKey];
                        totalHits += count;
                        m.gPatTuple.forEach(p => { if(gRes === p) { const k = `일반[${p}]`; points[k] = (points[k] || 0) + weight * count; } });
                        m.hPatTuple.forEach(p => { if(hRes === p) { const k = `핸디[${p}]`; points[k] = (points[k] || 0) + weight * count; } });
                    }
                }
            });

            if(Object.keys(points).length === 0) return { text: "매칭 사례 없음", conf: 0 };
            const hScore = getMomentumScore(m.home).score, aScore = getMomentumScore(m.away).score, diff = hScore - aScore;
            if(diff >= 5.0 && points["일반[승]"]) points["일반[승]"] *= 1.3;
            else if(diff <= -5.0 && points["일반[패]"]) points["일반[패]"] *= 1.3;

            const sorted = Object.entries(points).sort((a,b) => b[1] - a[1]);
            const [bestKey, bestVal] = sorted[0], sumPoints = Object.values(points).reduce((a,b) => a+b, 0);
            let confidence = (bestVal / sumPoints) * 70 + Math.min(totalHits, 25) * 1.2;
            confidence = Math.min(100, Math.floor(confidence));
            const prefix = confidence >= 82 ? "🔥[강력]" : (confidence >= 68 ? "[추천]" : "[일반]");
            return { text: `${prefix} ${bestKey} (${confidence}점)`, key: bestKey, conf: confidence, hits: totalHits };
        }

        function generateTierCombos() {
            const container = document.getElementById('tier-results');
            container.innerHTML = `<h2 style="color:var(--yellow); text-align:center;">🚀 Ninety-Nine Multi-Tier Engine</h2>`;
            
            const candidates = upcomingData.map(m => {
                const p = getPredictionAI(m);
                let oddsVal = 0;
                if(p.conf >= 62) {
                    const char = p.key.split('[')[1][0];
                    const idx = char === "승" ? 0 : (char === "무" ? 1 : 2);
                    oddsVal = p.key.includes("일반") ? Number(m.gOdds[idx]) : Number(m.hOdds[idx]);
                }
                return { m, p, odds: oddsVal || 0 };
            }).filter(c => c.odds > 1.05).sort((a,b) => b.p.conf - a.p.conf).slice(0, 24);

            const findCombos = (count, minO, maxO, label) => {
                let html = `<div class="tier-card"><div class="tier-title">${label}</div>`;
                const allCombos = getCombinations(candidates, count);
                const found = [];
                
                allCombos.forEach(combo => {
                    const totalO = combo.reduce((a, b) => a * b.odds, 1);
                    const avgConf = combo.reduce((a, b) => a + b.p.conf, 0) / count;
                    if(totalO >= minO && totalO <= maxO) found.push({combo, totalO, avgConf});
                    if(found.length >= 15) return;
                });

                found.sort((a, b) => b.avgConf - a.avgConf);
                if(found.length === 0) html += `<div style="color:#888;">조건을 충족하는 최적 조합이 없습니다.</div>`;
                else {
                    found.slice(0, 2).forEach(f => {
                        html += `<div class="combo-box">★ <span class="odds-val">${f.totalO.toFixed(2)}배</span> (평균 신뢰도: ${f.avgConf.toFixed(1)}점)<br>`;
                        f.combo.forEach(c => {
                            // 일반/핸디 구분을 명확히 하기 위해 문자열 가공
                            const betType = c.p.key.includes("일반") ? "일반" : "핸디";
                            const betRes = c.p.key.split('[')[1].split(']')[0];
                            html += ` > ${c.m.home} [${betType}_${betRes}] (${c.odds.toFixed(2)}배)<br>`;
                        });
                        html += `</div>`;
                    });
                }
                container.insertAdjacentHTML('beforeend', html + `</div>`);
            };

            findCombos(3, 5.0, 15.0, "TIER 1 (안정형)");
            findCombos(4, 16.0, 30.0, "TIER 2 (전략형)");
            findCombos(5, 31.0, 99.0, "TIER 3 (나인티나인 잭팟)");
        }

        function renderAll() {
            const listAll = document.getElementById('list-all');
            const listSmp = document.getElementById('list-smp');
            listAll.innerHTML = ""; listSmp.innerHTML = "";

            upcomingData.forEach((m, idx) => {
                const pred = getPredictionAI(m);
                const colorClass = pred.key?.includes("승") ? "win" : (pred.key?.includes("패")?"loss":"draw");
                const html = `
                    <tr onclick="showDetail(${idx})">
                        <td>${m.time}</td>
                        <td><span class="${m.isSmp?'smp-league':''}">${m.league}</span></td>
                        <td style="text-align:left">${m.home} vs ${m.away}</td>
                        <td>${renderOdds(m.gOdds, m.gPat)}</td>
                        <td style="background:#f1f2f6">${m.handi}</td>
                        <td>${renderOdds(m.hOdds, m.hPat)}</td>
                        <td class="${pred.conf>=82?'strong-pick':colorClass}">${pred.text}</td>
                    </tr>
                `;
                listAll.insertAdjacentHTML('beforeend', html);
                if(m.isSmp) listSmp.insertAdjacentHTML('beforeend', html);
            });
        }

        function renderOdds(odds, patStr) {
            return odds.map((o, i) => {
                const label = ["승","무","패"][i];
                return `<span class="${patStr.includes(label) ? 'is-pattern' : ''}">${o?Number(o).toFixed(2):'0.00'}</span>`;
            }).join(" ");
        }

        function runSimulation() {
            const samples = pastData.slice(-100);
            if(samples.length === 0) { alert("데이터가 없습니다."); return; }
            let hits = 0;
            samples.forEach(m => {
                const p = getPredictionAI(m);
                if(p.key && (m.genRes === p.key.split('[')[1][0])) hits++;
            });
            alert(`🧪 최근 ${samples.length}경기 백테스팅: 적중률 ${(hits/samples.length*100).toFixed(1)}%`);
        }

        function showDetail(idx) {
            const m = upcomingData[idx];
            const p = getPredictionAI(m);
            const h = getMomentumScore(m.home);
            const a = getMomentumScore(m.away);
            const content = `
[분석 대상] ${m.league} | ${m.home} vs ${m.away}
[패턴 정보] 일반: ${m.gPat || '-'} / 핸디: ${m.hPat || '-'}
------------------------------------------------
▶ 기세 점수: 홈(${h.score}) vs 원정(${a.score})
▶ 최근 흐름: 홈(${h.history.join('-')}) / 원정(${a.history.join('-')})
▶ AI 결론: ${p.text}
▶ 근거 사례: 총 ${p.hits}회 사례 기반 (신뢰도 ${p.conf}%)
------------------------------------------------
※ 파이썬 v10.11 엔진과 동일한 연산 로직이 적용되었습니다.
            `;
            document.getElementById('m-content').innerText = content;
            document.getElementById('modal').style.display = 'block';
            document.querySelector('.overlay').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.querySelector('.overlay').style.display = 'none';
        }
    </script>
</body>
</html>
